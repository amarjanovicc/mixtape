<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mixtape 💌</title>
  <meta name="description" content="Svaki dan jedna pjesma koja me podsjetila na tebe.">
  <meta name="theme-color" content="#1b1020">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:title" content="Mixtape 💌">
  <meta property="og:description" content="Svaki dan jedna pjesma koja me podsjetila na tebe.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📼</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,400&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <span class="brand" id="brand">mixtape za tebe</span>
      <span class="streak" id="streak" hidden></span>
    </header>

    <a class="back" id="back" href="./" hidden>← na najnoviju</a>

    <section class="stage" id="stage" hidden>
      <div class="tape" id="tape">
        <div class="tape-label">
          <span class="tape-line" id="tape-line1"></span>
          <span class="tape-line small" id="tape-line2"></span>
        </div>
        <div class="tape-window">
          <span class="spool" id="spool-l"><i class="reel"></i></span>
          <i class="tape-band"></i>
          <span class="spool" id="spool-r"><i class="reel"></i></span>
        </div>
        <i class="screw s1"></i><i class="screw s2"></i>
      </div>

      <div class="deck" id="deck" hidden>
        <div class="deck-keys">
          <button type="button" id="rew" aria-label="Premotaj unazad (drži)">⏪</button>
          <button type="button" id="play" class="deck-play" aria-label="Pusti">▶</button>
          <button type="button" id="ffw" aria-label="Premotaj unaprijed (drži)">⏩</button>
        </div>
        <p class="deck-time"><span id="time">0:00</span> · povuci kasetu ili drži ⏪ za premotavanje</p>
      </div>
      <audio id="audio" preload="none"></audio>

      <div class="reveal" id="reveal">
        <div class="ticket-head" id="ticket-head" hidden><span>★ SREĆKA ★</span><span id="ticket-no"></span></div>
        <div class="reveal-body" id="reveal-body">
          <div class="reveal-content">
            <p class="eyebrow" id="label"></p>
            <h1 class="title" id="title"></h1>
            <p class="artist" id="artist"></p>
          </div>
          <canvas class="scratch" id="scratch" hidden></canvas>
          <div class="veil" id="veil" hidden>?&nbsp;?&nbsp;?</div>
        </div>
        <p class="ticket-foot" id="ticket-foot" hidden>ogrebi srebrno polje · svaka srećka dobiva ♥</p>
      </div>

      <div class="game" id="game" hidden>
        <p class="hint" id="hint" hidden></p>
        <p class="game-text" id="game-text"></p>
        <button class="pump" id="pump" type="button" aria-label="Tapni srce" hidden>♥</button>
        <button class="hold" id="hold" type="button" hidden><span>drži</span></button>
        <button class="skip" id="skip" type="button">samo otvori</button>
      </div>
    </section>

    <section class="after" id="after" hidden>
      <div class="player" id="player"></div>
      <div class="links" id="links"></div>

      <blockquote class="note" id="note-wrap" hidden>
        <p class="note-lead" id="note-lead"></p>
        <p class="note-text" id="note"></p>
        <p class="sign" id="sign"></p>
      </blockquote>

      <div class="react">
        <p class="react-q">kako ti je sjela?</p>
        <div class="react-row" id="react-row"></div>
        <a class="btn btn-ghost" id="tell" href="#" hidden>javi mu →</a>
      </div>

      <p class="ps" id="ps" hidden></p>
      <p class="next" id="next" hidden></p>
    </section>

    <section class="empty" id="empty" hidden>
      <div class="empty-emoji" aria-hidden="true">📼</div>
      <h1 class="title" id="empty-title">Prva pjesma stiže uskoro</h1>
      <p class="artist" id="empty-text">vrati se malo kasnije</p>
    </section>

    <section class="shelf" id="shelf" hidden>
      <h2>Tvoja kaseta <span id="shelf-count"></span></h2>
      <ol id="shelf-list"></ol>
    </section>
  </main>

  <noscript><p class="noscript">Uključi JavaScript da vidiš današnju pjesmu 💌</p></noscript>

  <script src="songs.js"></script>
  <script src="app.js"></script>
</body>
</html>
