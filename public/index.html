<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mixtape</title>
  <meta name="description" content="Svaki dan jedna pjesma koja me podsjetila na tebe.">
  <meta name="theme-color" content="#f1e7d3">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:title" content="Mixtape">
  <meta property="og:description" content="Svaki dan jedna pjesma koja me podsjetila na tebe.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='1.5' y='4.500' width='21' height='15' rx='3' fill='%23ff7aa8'/><rect x='4.500' y='7' width='15' height='4' rx='1' fill='%23fff8ee'/><circle cx='8.500' cy='14.800' r='2' fill='%232a1830'/><circle cx='15.500' cy='14.800' r='2' fill='%232a1830'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Courier+Prime:wght@400;700&family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,400&display=swap">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mixtape">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ikone: sve na stranici crta se odavde, bez emojija i znakova -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-heart" viewBox="0 0 24 24"><path fill="currentColor" d="M12 20.500C5.500 16 2.500 12.600 2.500 8.900 2.500 6.200 4.600 4 7.300 4c1.900 0 3.600 1 4.700 2.600C13.100 5 14.800 4 16.700 4c2.700 0 4.800 2.200 4.800 4.900 0 3.700-3 7.100-9.500 11.600z"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M7.500 4.200v15.600L20 12z"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path fill="currentColor" d="M6.500 4.500h4v15h-4zM13.500 4.500h4v15h-4z"/></symbol>
      <symbol id="i-rewind" viewBox="0 0 24 24"><path fill="currentColor" d="M11.500 5v14L2 12zM22 5v14l-9.500-7z"/></symbol>
      <symbol id="i-forward" viewBox="0 0 24 24"><path fill="currentColor" d="M12.500 5v14L22 12zM2 5v14l9.500-7z"/></symbol>
      <symbol id="i-volume" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.500h3.500L12 5.500v13l-4.500-4H4z"/><path d="M15.500 9a4.200 4.200 0 0 1 0 6M18.200 6.500a8 8 0 0 1 0 11"/></g></symbol>
      <symbol id="i-volume-off" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.500h3.500L12 5.500v13l-4.500-4H4z"/><path d="M16 9.500l5 5M21 9.500l-5 5"/></g></symbol>
      <symbol id="i-flame" viewBox="0 0 24 24"><path fill="currentColor" d="M12.600 2.500c.5 3.300 4.900 5.600 4.900 10.900a5.500 5.500 0 0 1-11 0c0-2 .9-3.600 2.100-4.700.2 1.600.9 2.600 1.900 3-.6-3.400.4-7.200 2.100-9.200z"/></symbol>
      <symbol id="i-music" viewBox="0 0 24 24"><path fill="currentColor" d="M9.500 5.200l10-2.200v12.800a3.200 3.200 0 1 1-2-3V7l-6 1.300v9.500a3.200 3.200 0 1 1-2-3z"/></symbol>
      <symbol id="i-sparkle" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.500l2.300 7.200 7.200 2.300-7.200 2.300L12 21.500l-2.300-7.200L2.500 12l7.200-2.300z"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.800l2.800 5.900 6.400.8-4.700 4.500 1.200 6.400L12 17.300l-5.700 3.100 1.200-6.400L2.800 9.500l6.400-.8z"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5.500" y="10.500" width="13" height="10" rx="2.500"/><path d="M8.500 10.500V7.500a3.500 3.500 0 0 1 7 0v3M12 14.500v2"/></g></symbol>
      <symbol id="i-arrow-left" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" d="M19 12H5M11 6l-6 6 6 6"/></symbol>
      <symbol id="i-arrow-right" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="i-drag" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/></symbol>
      <symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path fill="currentColor" d="M7.500 13h9a4.500 4.500 0 0 1-9 0z"/><circle cx="9" cy="9.500" r="1.200" fill="currentColor"/><circle cx="15" cy="9.500" r="1.200" fill="currentColor"/></symbol>
      <symbol id="i-tear" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3c3.300 4.200 6 7.400 6 11a6 6 0 0 1-12 0c0-3.600 2.700-6.800 6-11z"/></symbol>
      <symbol id="i-cassette" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"><rect x="2.500" y="5.500" width="19" height="13" rx="2.500"/><circle cx="8.500" cy="12" r="1.800"/><circle cx="15.500" cy="12" r="1.800"/><path d="M10.300 12h3.400M7 18.500l1.500-2.500h7l1.500 2.500"/></g></symbol>
      <symbol id="i-box" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16v10.500H4zM2.500 4.500h19V9h-19zM9.500 13h5"/></g></symbol>
      <symbol id="i-gift" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.500 11.500h15v9h-15zM3 7.500h18v4H3zM12 7.500v13M12 7.500c-1.500-4-6-3.500-5-1 .6 1.300 3 1 5 1zM12 7.500c1.500-4 6-3.500 5-1-.6 1.300-3 1-5 1z"/></g></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round" d="M4.500 12.500l5 5 10-11"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></symbol>
    </defs>
  </svg>

  <main class="wrap">
    <header class="top">
      <span class="brand" id="brand">mixtape za tebe</span>
      <span class="top-right">
        <span class="streak" id="streak" hidden></span>
        <button class="mute" id="mute" type="button" aria-label="Isključi zvuk" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-volume"/></svg></button>
      </span>
    </header>

    <div class="view" id="view-today">
    <a class="back" id="back" href="./" hidden><svg class="icon" aria-hidden="true"><use href="#i-arrow-left"/></svg> na najnoviju</a>

    <section class="stage" id="stage" hidden>
      <div class="tape" id="tape">
        <!-- naljepnica je ujedno i srećka: ispod folije piše koja je pjesma -->
        <div class="tape-label" id="tape-label">
          <h1 class="tape-line" id="tape-line1"></h1>
          <p class="tape-line small" id="tape-line2"></p>
          <canvas class="scratch" id="scratch" hidden></canvas>
          <div class="veil" id="veil" hidden><svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg></div>
        </div>
        <div class="tape-window">
          <span class="spool" id="spool-l"><i class="reel"></i></span>
          <i class="tape-band"></i>
          <span class="spool" id="spool-r"><i class="reel"></i></span>
        </div>
        <i class="screw s1"></i><i class="screw s2"></i>
        <i class="tape-sticker" id="tape-sticker"></i>
        <span class="tape-meta" id="tape-meta"></span>
      </div>

      <div class="deck" id="deck" hidden>
        <p class="game-text intro-only">premotaj kasetu na početak</p>
        <div class="deck-keys">
          <button type="button" id="rew" aria-label="Premotaj unazad (drži)"><svg class="icon" aria-hidden="true"><use href="#i-rewind"/></svg></button>
          <button type="button" id="play" class="deck-play" aria-label="Pusti"><svg class="icon" aria-hidden="true"><use href="#i-play"/></svg></button>
          <button type="button" id="ffw" aria-label="Premotaj unaprijed (drži)"><svg class="icon" aria-hidden="true"><use href="#i-forward"/></svg></button>
        </div>
        <div class="bar" aria-hidden="true"><i id="bar-fill"></i></div>
        <p class="deck-time"><span id="time">0:00</span><em id="deck-hint"></em></p>
        <button class="skip intro-only" id="rewind-skip" type="button">samo pusti</button>
      </div>
      <audio id="audio" preload="none"></audio>

      <div class="game" id="game" hidden>
        <p class="hint" id="hint" hidden></p>
        <p class="game-text" id="game-text"></p>
        <div class="guess" id="guess" hidden>
          <button class="btn btn-primary" id="guess-play" type="button"><svg class="icon" aria-hidden="true"><use href="#i-rewind"/></svg>pusti unazad</button>
          <div class="guess-opts" id="guess-opts"></div>
        </div>
        <button class="skip" id="skip" type="button">samo otvori</button>
      </div>
    </section>

    <section class="after" id="after" hidden>
      <blockquote class="note" id="note-wrap" hidden>
        <p class="note-lead" id="note-lead"></p>
        <p class="note-text" id="note"></p>
        <p class="sign" id="sign"></p>
      </blockquote>

      <div class="react">
        <p class="react-q">kako ti je sjela?</p>
        <div class="react-row" id="react-row"></div>
        <a class="btn btn-ghost" id="tell" href="#" hidden>javi mu <svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg></a>
      </div>

      <p class="ps" id="ps" hidden></p>

      <!-- kraj rituala: kaseta ide u kutiju, a to puni put do sljedeće naljepnice -->
      <div class="keep">
        <button class="collect" id="collect" type="button"></button>
        <p class="sticker-progress" id="sticker-progress" hidden></p>
        <div class="unlock" id="unlock" hidden></div>
      </div>

      <div class="full">
        <h2>Cijela pjesma</h2>
        <div class="player" id="player"></div>
        <div class="links" id="links"></div>
      </div>

      <p class="next" id="next" hidden></p>
    </section>

    <section class="empty" id="empty" hidden>
      <div class="empty-icon"><svg class="icon" aria-hidden="true"><use href="#i-cassette"/></svg></div>
      <h1 class="title" id="empty-title">Prva pjesma stiže uskoro</h1>
      <p class="artist" id="empty-text">vrati se malo kasnije</p>
    </section>

    </div>

    <div class="view" id="view-box" hidden>
      <section class="box">
        <h2>Kutija s kasetama <span id="box-count"></span></h2>
        <div class="crate"><div class="crate-grid" id="box-grid"></div></div>
        <p class="box-tip" id="box-tip"></p>
      </section>

      <section class="rewards" id="rewards" hidden>
        <h2>Naljepnice <span id="reward-count"></span></h2>
        <p class="box-tip">Svaka kaseta u kutiji vodi bliže sljedećoj.</p>
        <div class="stickers" id="reward-list"></div>
      </section>
    </div>
  </main>

  <!-- šapat s dna ekrana: daje do znanja da ispod ima još, a ne kaže što -->
  <button class="peek" id="peek" type="button" tabindex="-1"><span id="peek-text"></span><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg></button>

  <nav class="tabs" id="tabs" aria-label="Pogledi" hidden>
    <button type="button" data-view="today" aria-current="true"><svg class="icon" aria-hidden="true"><use href="#i-cassette"/></svg><span>Danas</span></button>
    <button type="button" data-view="box"><svg class="icon" aria-hidden="true"><use href="#i-box"/></svg><span>Kutija</span><b class="badge" id="box-badge" hidden></b></button>
  </nav>

  <noscript><p class="noscript">Uključi JavaScript da vidiš današnju pjesmu.</p></noscript>

  <script src="songs.js"></script>
  <script src="pixel.js"></script>
  <script src="app.js"></script>
</body>
</html>
